<!DOCTYPE html>
<html>
<head>
    <title>Cuenta Atrás</title>
</head>
<body>

<script type="text/javascript">

var countdown = prompt("Introduce un número para iniciar la cuenta atrás:");

while (countdown > 0) {
    alert(countdown + "...");
    countdown--;
}

alert("Fin de la cuenta atrás");

</script>

</body>
</html>
