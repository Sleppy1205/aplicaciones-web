<!DOCTYPE html>
<html>
<head>
    <title>Cuenta Atrás con For</title>
</head>
<body>

<script type="text/javascript">

var countdown = prompt("Introduce un número para iniciar la cuenta atrás:");

for (countdown; countdown > 0; countdown--) {
    alert(countdown + "...");
}

alert("Fin de la cuenta atrás");

</script>

</body>
</html>
